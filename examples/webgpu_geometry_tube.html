<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - tube geometry</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - tube geometry">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_geometry_tube.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_geometry_tube.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Tube Geometry</span>
			</div>

			<small>
				Animated React logo built from oval tubes, each with a sphere sliding along its center axis.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

			// An oval in the XY plane, written in the same style as the curves in CurveExtras.js

			class OvalCurve extends THREE.Curve {

				constructor( radiusX = 1, radiusY = 1 ) {

					super();

					this.radiusX = radiusX;
					this.radiusY = radiusY;

				}

				getPoint( t, optionalTarget = new THREE.Vector3() ) {

					const point = optionalTarget;

					t = 2 * Math.PI * t;

					return point.set( this.radiusX * Math.cos( t ), this.radiusY * Math.sin( t ), 0 );

				}

			}

			let camera, scene, renderer, controls, timer;

			let logo, nucleus, tubeGeometry;

			const orbits = [];

			const params = {
				scale: 1,
				radiusX: 10,
				radiusY: 3.8,
				tubeRadius: 0.35,
				marbleRadius: 0.8,
				nucleusRadius: 1.8,
				tubularSegments: 128,
				radialSegments: 16,
				marbleSpeed: 0.25,
				spinSpeed: 0.3
			};

			// all three orbits share one curve and one tube geometry, rotated 60 degrees apart

			const curve = new OvalCurve( params.radiusX, params.radiusY );

			let progress = 0;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 1000 );
				camera.position.set( 0, 0, 40 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x20232a );

				timer = new THREE.Timer();
				timer.connect( document );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const pmremGenerator = new THREE.PMREMGenerator( renderer );
				scene.environment = pmremGenerator.fromScene( new RoomEnvironment(), 0.04 ).texture;

				// logo

				const tubeMaterial = new THREE.MeshStandardMaterial( { color: 0x61dafb, roughness: 0.3, metalness: 0.1 } );
				const marbleMaterial = new THREE.MeshStandardMaterial( { color: 0xffffff, roughness: 0.1, metalness: 0.2 } );

				// unit spheres, sized through Object3D.scale so resizing never rebuilds them

				const sphereGeometry = new THREE.SphereGeometry( 1, 32, 16 );

				logo = new THREE.Group();
				scene.add( logo );

				nucleus = new THREE.Mesh( sphereGeometry, tubeMaterial );
				logo.add( nucleus );

				tubeGeometry = createTubeGeometry();

				for ( let i = 0; i < 3; i ++ ) {

					// the tube and its marble share a parent, so the marble inherits the orbit's rotation and the logo's scale

					const orbit = new THREE.Group();
					orbit.rotation.z = i * Math.PI / 3;
					logo.add( orbit );

					const tube = new THREE.Mesh( tubeGeometry, tubeMaterial );
					orbit.add( tube );

					const marble = new THREE.Mesh( sphereGeometry, marbleMaterial );
					orbit.add( marble );

					orbits.push( { tube, marble, phase: i / 3 } );

				}

				updateSizes();

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 10;
				controls.maxDistance = 200;

				// parameters

				const gui = renderer.inspector.createParameters( 'Parameters' );

				const folderSize = gui.addFolder( 'Size' );
				folderSize.add( params, 'scale', 0.25, 3, 0.01 ).onChange( updateSizes );
				folderSize.add( params, 'radiusX', 2, 20, 0.1 ).onChange( updateCurve );
				folderSize.add( params, 'radiusY', 1, 20, 0.1 ).onChange( updateCurve );
				folderSize.add( params, 'tubeRadius', 0.05, 2, 0.01 ).onChange( updateTube );
				folderSize.add( params, 'marbleRadius', 0.1, 3, 0.01 ).onChange( updateSizes );
				folderSize.add( params, 'nucleusRadius', 0.1, 5, 0.01 ).onChange( updateSizes );

				const folderGeometry = gui.addFolder( 'Geometry' );
				folderGeometry.add( params, 'tubularSegments', 16, 512, 1 ).onChange( updateTube );
				folderGeometry.add( params, 'radialSegments', 3, 32, 1 ).onChange( updateTube );

				const folderAnimation = gui.addFolder( 'Animation' );
				folderAnimation.add( params, 'marbleSpeed', 0, 2, 0.01 );
				folderAnimation.add( params, 'spinSpeed', - 2, 2, 0.01 );

				//

				window.addEventListener( 'resize', onWindowResize );

				renderer.setAnimationLoop( animate );

			}

			function createTubeGeometry() {

				return new THREE.TubeGeometry( curve, params.tubularSegments, params.tubeRadius, params.radialSegments, true );

			}

			function updateTube() {

				tubeGeometry.dispose();
				tubeGeometry = createTubeGeometry();

				for ( const { tube } of orbits ) tube.geometry = tubeGeometry;

			}

			function updateCurve() {

				curve.radiusX = params.radiusX;
				curve.radiusY = params.radiusY;

				// the cached arc lengths used by getPointAt() are stale once the curve changes

				curve.updateArcLengths();

				updateTube();

			}

			function updateSizes() {

				logo.scale.setScalar( params.scale );
				nucleus.scale.setScalar( params.nucleusRadius );

				for ( const { marble } of orbits ) marble.scale.setScalar( params.marbleRadius );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				// accumulate progress so changing the speed does not make the marbles jump

				progress = ( progress + delta * params.marbleSpeed ) % 1;

				for ( const { marble, phase } of orbits ) {

					// getPointAt() is arc-length parameterized, so the marbles move at a constant speed
					// along the tube's center axis regardless of the oval's proportions

					curve.getPointAt( ( progress + phase ) % 1, marble.position );

				}

				logo.rotation.z += delta * params.spinSpeed;

				controls.update();

				renderer.render( scene, camera );

			}

		</script>

	</body>

</html>
