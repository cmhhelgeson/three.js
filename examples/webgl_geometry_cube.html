<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - geometry - cube</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info" style="position: absolute; display: flex; justify-content: space-around;">
			<div>WebGL Renderer</div>
			<div>WebGPU WebGPUBackend</div>
			<div>WebGPU WebGLBackend</div>
		
		</div>
		<div id="root" style="display: flex"></div>
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import * as THREEGPU from 'three/webgpu';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			let camera, scene;
			let mesh;
			
			let webGLRenderer;
			let webGPUBackendRenderer;
			let webGLBackendRenderer;
			let appendElement;
			let gui;

			const effectController = {
				emulateWebGLOutput: false,
			};

			let thirdWidth = window.innerWidth / 3;

			init();

			function init() {

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.z = 4;

				scene = new THREE.Scene();
			
				const geometry = new THREE.TorusKnotGeometry();
				const material = new THREE.MeshNormalMaterial( { emulateWebGLOutput: false } );

				console.log( material );

				mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				// Create WebGLRenderer
				webGLRenderer = new THREE.WebGLRenderer( { antialias: true } );
				webGLRenderer.setPixelRatio( window.devicePixelRatio );
				webGLRenderer.setSize( thirdWidth, window.innerHeight );
				webGLRenderer.setAnimationLoop( animate );

				// Create WebGPURenderer
				webGPUBackendRenderer = new THREEGPU.WebGPURenderer( { antialias: true } );
				webGPUBackendRenderer.setPixelRatio( window.devicePixelRatio );
				webGPUBackendRenderer.setSize( thirdWidth, window.innerHeight );
				webGPUBackendRenderer.toneMapping = THREE.LinearToneMapping;
				webGPUBackendRenderer.setAnimationLoop( animate );

				// Create WebGPURenderer WebGL Backend Renderer
				webGLBackendRenderer = new THREEGPU.WebGPURenderer( { antialias: true, forceWebGL: true } );
				webGLBackendRenderer.setPixelRatio( window.devicePixelRatio );
				webGLBackendRenderer.setSize( thirdWidth, window.innerHeight );
				webGLBackendRenderer.toneMapping = THREE.LinearToneMapping;
				webGLBackendRenderer.setAnimationLoop( animate );

				const rootElement = document.getElementById( 'root' );

				rootElement.appendChild( webGLRenderer.domElement );
				rootElement.appendChild( webGPUBackendRenderer.domElement );
				rootElement.appendChild( webGLBackendRenderer.domElement );

				const gui = new GUI();

				gui.add( effectController, 'emulateWebGLOutput' ).onChange( () => {

					material.emulateWebGLOutput = effectController.emulateWebGLOutput;
					material.needsUpdate = true;

			
				} );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				thirdWidth = window.innerWidth / 3;

				webGLRenderer.setSize( thirdWidth, window.innerHeight );
				webGPUBackendRenderer.setSize( thirdWidth, window.innerHeight );
				webGLBackendRenderer.setSize( thirdWidth, window.innerHeight );

			}

			function animate() {

				mesh.rotation.y += 0.005;

				webGLRenderer.render( scene, camera );
				webGPUBackendRenderer.renderAsync( scene, camera );
				webGLBackendRenderer.renderAsync( scene, camera );

			}

		</script>

	</body>
</html>
