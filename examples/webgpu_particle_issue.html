		<script type="module">


import * as THREE from 'three';
import { uniform } from 'three/tsl';

import GUI from 'three/examples/jsm/libs/lil-gui.module.min.js';

import MATH from '../../utils/math';

import { ParticleRenderer, ParticleSystem, EmitterParameters, Emitter, PointEmitterShape } from '../../utils/particle-system';
import { PointsNodeMaterial } from 'three/webgpu';

class App {

	// Override these methods
	async onSetupProject( projectFolder ) {
	}

	onRender( deltaTime ) {
	}

	onStep( deltaTime, totalTimeElapsed ) {
	}

	onResize() {
	}

	constructor() {

		this.debugUIMap = {};
		this.rendererSettings = {
		// Time Settings
			useDeltaTime: true,
			useFixedFrameRate: false,
			fixedTimeStep: 0.03,
			fixedUnifiedFPS: 30,
			fixedCPUFPS: 30,
			fixedGPUFPS: 30,
			// Time Values
			clampMin: 0.01,
			clampMax: 0.5,
			// Canvas Settings,
			resizeCanvas: true,
			cameraResizeUpdate: true,
			useFixedAspectRatio: false,
			useDPR: true,
			// Canvas Values
			fixedAspectController: '16:9',
			aspectWidth: 16,
			aspectHeight: 9,
			dprValue: 'Device',
		};

		this.timeSinceLastUpdate = 0;
		this.timeSinceLastRender = 0;


	}

	setupRenderer( options ) {

		this.renderer = new WebGPURenderer( {
			canvas: document.getElementById( 'c' ),
			forceWebGL: options.webGL !== undefined ? options.webGL : false
		} );
		this.renderer.setSize( window.innerWidth, window.innerHeight );
		this.renderer.setClearColor( 0x000000 );
		document.body.appendChild( this.renderer.domElement );

		this.stats = new Stats();
		document.body.appendChild( this.stats.dom );

		const aspect = window.innerWidth / window.innerHeight;
		this.camera = new THREE.PerspectiveCamera( 50, aspect, 0.1, 2000 );
		this.camera.position.z = 200;

		this.controls = new OrbitControls( this.camera, this.renderer.domElement );
		// Smooths camera movement
		this.controls.enableDamping = true;
		// Explicitly set camera's target to the default of 0, 0, 0
		this.controls.target.set( 0, 0, 0 );
		this.controls.update();

		this.scene = new THREE.Scene();

		this.debugUI = new GUI();
		if ( options.debug ) {

			this.addRendererDebugGui();

		}


	}

	async setupProject( options ) {

		await this.setupRenderer( options );

		// Initialize project
		// const projectFolder = this.debugUI.addFolder( options.projectName ?? 'Project' );

		// Apply project specific parameters to the scene
		await this.onSetupProject( );

	}

	addRendererDebugGui() {

		this.debugUIMap[ 'Time Settings' ] = this.debugUI.addFolder( 'Time Settings' );
		this.debugUIMap[ 'Time Settings' ].add( this.rendererSettings, 'useDeltaTime' );
		this.debugUIMap[ 'Time Settings' ].add( this.rendererSettings, 'useFixedFrameRate' );
		this.debugUIMap[ 'Time Values' ] = this.debugUI.addFolder( 'Time Values' );
		this.debugUIMap[ 'Time Values' ].add( this.rendererSettings, 'fixedTimeStep', 0.01, 0.5 );
		const fixedCPU = this.debugUIMap[ 'Time Values' ].add( this.rendererSettings, 'fixedCPUFPS', 1, 60 ).step( 1 );
		const fixedGPU = this.debugUIMap[ 'Time Values' ].add( this.rendererSettings, 'fixedGPUFPS', 1, 60 ).step( 1 );
		// Set CPU and GPU to run at same rate when useFixedFrameRate === true
		this.debugUIMap[ 'Time Values' ].add( this.rendererSettings, 'fixedUnifiedFPS', 1, 60 ).step( 1 ).onChange( () => {

			this.rendererSettings.fixedCPUFPS = this.rendererSettings.fixedUnifiedFPS;
			fixedCPU.setValue( this.rendererSettings.fixedUnifiedFPS );
			this.rendererSettings.fixedGPUFPS = this.rendererSettings.fixedUnifiedFPS;
			fixedGPU.setValue( this.rendererSettings.fixedUnifiedFPS );

		} );
		this.debugUIMap[ 'Time Values' ].add( this.rendererSettings, 'clampMin', 0.01, 1.0 );
		this.debugUIMap[ 'Time Values' ].add( this.rendererSettings, 'clampMax', 0.01, 1.0 );
		this.debugUIMap[ 'Resize Settings' ] = this.debugUI.addFolder( 'Resize Settings' );
		this.debugUIMap[ 'Resize Settings' ].add( this.rendererSettings, 'resizeCanvas' ).onChange( () => {

			this.onWindowResize();

		} );
		this.debugUIMap[ 'Resize Settings' ].add( this.rendererSettings, 'cameraResizeUpdate' ).onChange( () => {

			this.onWindowResize();

		} );
		this.debugUIMap[ 'Resize Settings' ].add( this.rendererSettings, 'useFixedAspectRatio' ).onChange( () => {

			this.onWindowResize();

		} );
		this.debugUIMap[ 'Resize Settings' ].add( this.rendererSettings, 'useDPR' ).onChange( () => {

			this.onWindowResize();

		} );
		this.debugUIMap[ 'Resize Values' ] = this.debugUI.addFolder( 'Resize Values' );
		this.debugUIMap[ 'Resize Values' ].add( this.rendererSettings, 'fixedAspectController', [
			'16:9 (HD)',
			'4:3 (CRT)',
			'1:85:1 (Standard)',
			'2.39:1 (Anamorphic)',
			'2.76:1 (Ultra Panavasion)',
			'1.90:1 ("Imax")',
			'1.43:1 (Imax Film)',
			'4:1 (Gance)',
			'1:1'
		] ).onChange( () => {

			// Lazy way, no parsing
			switch ( this.rendererSettings.fixedAspectController ) {

				case '16:9 (HD)': {

					this.rendererSettings.aspectWidth = 16;
					this.rendererSettings.aspectHeight = 9;
					break;

				}

				case '4:3 (CRT)': {

					this.rendererSettings.aspectWidth = 4;
					this.rendererSettings.aspectHeight = 3;
					break;

				}

				case '1:85:1 (Standard)': {

					this.rendererSettings.aspectWidth = 1.85;
					this.rendererSettings.aspectHeight = 1;
					break;

				}

				case '2.39:1 (Anamorphic)': {

					this.rendererSettings.aspectWidth = 2.39;
					this.rendererSettings.aspectHeight = 1;
					break;

				}

				case '2.76:1 (Ultra Panavasion)': {

					this.rendererSettings.aspectWidth = 2.76;
					this.rendererSettings.aspectHeight = 1;
					break;

				}

				case '1.90:1 ("Imax")': {

					this.rendererSettings.aspectWidth = 1.90;
					this.rendererSettings.aspectHeight = 1;
					break;

				}

				case '1.43:1 (Imax Film)': {

					this.rendererSettings.aspectWidth = 1.43;
					this.rendererSettings.aspectHeight = 1;
					break;

				}

				case '4:1 (Gance)': {

					this.rendererSettings.aspectWidth = 4.0;
					this.rendererSettings.aspectHeight = 1;
					break;

				}

				case '1:1': {

					this.rendererSettings.aspectWidth = 1.0;
					this.rendererSettings.aspectHeight = 1.0;
					break;

				}

			}

			this.onWindowResize();

		} ).name( 'Fixed Aspect Ratio' );

		this.debugUIMap[ 'Resize Values' ].add( this.rendererSettings, 'dprValue', [ 'Device', '0.1', '0.5', '1.0', '2.0', '3.0' ] ).onChange( () => {

			this.onWindowResize();

		} );

		for ( const folderName in this.debugUIMap ) {

			this.debugUIMap[ folderName ].close();

		}

	}


	raf() {

		requestAnimationFrame( () => {

			const { useDeltaTime, clampMin, clampMax, fixedTimeStep, useFixedFrameRate, fixedCPUFPS, fixedGPUFPS } = this.rendererSettings;

			const timeElapsed = this.clock.getDelta();
			const totalTimeElapsed = this.clock.getElapsedTime();
			const deltaTime = useDeltaTime ? Math.min( Math.max( timeElapsed, clampMin ), clampMax ) : fixedTimeStep;

			// We're still calculating literal time even when deltaTime is set arbitrarily
			this.timeSinceLastRender += timeElapsed;
			this.timeSinceLastUpdate += timeElapsed;

			if ( useFixedFrameRate ) {

				//  of times per second to update the state
				const cpuFrameInterval = 1 / fixedCPUFPS;
				//  of times per second to render a frame
				const gpuFrameInterval = 1 / fixedGPUFPS;

				if ( this.timeSinceLastRender >= cpuFrameInterval ) {

					this.step( useDeltaTime ? this.timeSinceLastUpdate : fixedTimeStep, totalTimeElapsed );
					this.timeSinceLastUpdate = 0;

				}

				if ( this.timeSinceLastRender >= gpuFrameInterval ) {

					this.render( deltaTime );
					this.timeSinceLastRender = 0;

				}

			} else {

				this.step( deltaTime, totalTimeElapsed );
				this.render( deltaTime );

			}

			this.raf();

		} );

	}

	// State update function
	step( deltaTime, totalTimeElapsed ) {

		this.onStep( deltaTime, totalTimeElapsed );

		//this.controls.update( deltaTime );

	}

	render( deltaTime ) {

		// App specific code executed per render
		this.onRender( deltaTime );
		this.renderer.render( this.scene, this.camera );

	}

	onWindowResize() {

		const { cameraResizeUpdate, useFixedAspectRatio, aspectWidth, aspectHeight, dprValue } = this.rendererSettings;

		let canvasWidth = window.innerWidth;
		let canvasHeight = window.innerHeight;

		const dpr = dprValue === 'Device' ? window.devicePixelRatio : parseFloat( dprValue );

		if ( useFixedAspectRatio ) {

			// Aspect ratio of your browser window
			const windowAspect = window.innerWidth / window.innerHeight;
			// Target aspect ratio of your image
			const targetAspect = aspectWidth / aspectHeight;

			// When window size is wider than target, limit the width to a factor of the height
			if ( windowAspect > targetAspect ) {

				// Window is too wide, limit width
				canvasHeight = window.innerHeight;
				canvasWidth = canvasHeight * targetAspect;

				// Otherwise limit the height

			} else {

				// Window is too tall, limit height
				canvasWidth = window.innerWidth;
				canvasHeight = canvasWidth / targetAspect;

			}

		}

		if ( cameraResizeUpdate ) {

			this.camera.aspect = useFixedAspectRatio ?
				aspectWidth / aspectHeight :
				window.innerWidth / window.innerHeight;
			this.camera.updateProjectionMatrix();

		}


		// Arguments: Width, height, and whether to resize the canvas
		this.renderer.setSize( canvasWidth, canvasHeight, this.rendererSettings.resizeCanvas );
		if ( this.rendererSettings.useDPR ) {

			this.renderer.setPixelRatio( dpr );

		} else {

			this.renderer.setPixelRatio( 1 );

		}

	}

	async initialize( options ) {

		this.clock = new THREE.Clock( true );

		// Setup event listeners before render loop
		window.addEventListener( 'resize', () => {

			this.onWindowResize();

		}, false );

		// Setup Project and call App specific onSetupProject
		await this.setupProject( options );

		// Resize window to meet current canvas dimensions
		this.onWindowResize();
		// Start render loop
		this.raf();

	}

	loadRGBE( path ) {

		const rgbeLoader = new RGBELoader();
		rgbeLoader.load( path, ( hdrTexture ) => {

			hdrTexture.mapping = THREE.EquirectangularReflectionMapping;

			this.scene.background = hdrTexture;
			this.scene.environment = hdrTexture;

		} );

	}

	get Scene() {

		return this.scene;

	}

	get Camera() {

		return this.camera;

	}

	get CameraControls() {

		return this.controls;

	}

	get Stats() {

		return this.stats;

	}

	get DebugGui() {

		return this.debugUI;


	}

}

class ParticleProject extends App {

	constructor() {

		super();

	}

	createPointsParticleSystem() {

		this.particleSystem = new ParticleSystem();

		// Maximum number of particles in memory/displayed at once
		const maxDisplayParticles = 500;

		const textureLoader = new THREE.TextureLoader();
		const starTexture = textureLoader.load( './resources/star.png' );

		// All particles use one life value (p.life / p.maxLife) so each interpolant has to cover
		// the same length of time, irrespective of whether it is doing anything during
		// large stretches of time.

		// Pucnh parameters
		const punchSizeOverLife = new MATH.FloatInterpolant( [
			{ time: 0, value: 100.0 },
			{ time: 1, value: 0.0 },
			{ time: 2, value: 100.0 },
			{ time: 3, value: 0.0 },
			{ time: 4, value: 200.0 },
			{ time: 5, value: 0.0 },
			{ time: 6, value: 100.0 },
			{ time: 18, value: 100.0 },
			{ time: 20, value: 200.0 }
		] );

		const punchAlphaOverLife = new MATH.FloatInterpolant( [
			{ time: 0, value: 1 },
			{ time: 8, value: 1 },
			{ time: 10, value: 0 },
			{ time: 12, value: 1 },
			{ time: 17, value: 1 },
			{ time: 18, value: 0 }
		] );

		const punchColorOverLife = new MATH.ColorInterpolant( [
			{ time: 0, value: new THREE.Color( 0xFFFFFF ) },
			{ time: 14, value: new THREE.Color( 0xFFFFFF ) },
			{ time: 15, value: new THREE.Color( 0xFF0000 ) },
			{ time: 16, value: new THREE.Color( 0x00FF00 ) },
			{ time: 17, value: new THREE.Color( 0x0000FF ) },
			{ time: 18, value: new THREE.Color( 0xFFFFFF ) },
		] );

		const punchTwinkleOverLife = new MATH.FloatInterpolant( [
			{ time: 0, value: 0 },
			{ time: 3, value: 1 },
			{ time: 4, value: 1 },
		] );

		// Generic Firework Explosion Parameters
		const explosionSizeOverLife = new MATH.FloatInterpolant( [
			{ time: 0, value: 30 },
			{ time: 5, value: 40 },
		] );

		const explosionAlphaOverLife = new MATH.FloatInterpolant( [
			{ time: 0, value: 0 },
			{ time: 0.25, value: 1 },
			{ time: 4.5, value: 1 },
			{ time: 5, value: 0 },
		] );

		const explosionColorOverLife = new MATH.ColorInterpolant( [
			{ time: 0, value: new THREE.Color().setHSL( 0, 1, 0.75 ) },
			{ time: 2, value: new THREE.Color().setHSL( 0.5, 1, 0.5 ) },
			{ time: 5, value: new THREE.Color().setHSL( 1, 1, 0.5 ) },
		] );

		const explosionTwinkleOverLife = new MATH.FloatInterpolant( [
			{ time: 0, value: 0 },
			{ time: 3, value: 1 },
			{ time: 4, value: 1 },
		] );

		this.uniformTypes[ 'Explosion' ] = {
			sizeOverLifeTexture: explosionSizeOverLife.toTexture(),
			colorOverLifeTexture: explosionColorOverLife.toTexture(),
			twinkleOverLifeTexture: explosionTwinkleOverLife.toTexture(),
			alphaOverLifeTexture: explosionAlphaOverLife.toTexture(),
			map: starTexture,
			spinSpeed: uniform( Math.PI )
		};

		this.uniformTypes[ 'Punch' ] = {
			sizeOverLifeTexture: punchSizeOverLife.toTexture(),
			colorOverLifeTexture: punchColorOverLife.toTexture(),
			twinkleOverLifeTexture: punchTwinkleOverLife.toTexture(),
			alphaOverLifeTexture: punchAlphaOverLife.toTexture(),
			map: starTexture,
			spinSpeed: uniform( Math.PI )
		};

		const emitterParams = new EmitterParameters();
		emitterParams.shape = new PointEmitterShape( new THREE.Vector3( 0, 0, 0 ) );
		emitterParams.particleEmissionRate = 5000;
		emitterParams.maxDisplayParticles = 500;
		emitterParams.startNumParticles = 500;
		emitterParams.maxEmission = 500;
		emitterParams.maxLife = 5;
		emitterParams.gravity = true;
		emitterParams.dragCoefficient = 4;
		emitterParams.velocityMagnitude = 150;
		emitterParams.velocityMagnitudeVariance = 10;
		emitterParams.rotationAngularVariance = 2 * Math.PI;
		emitterParams.spinSpeed = Math.PI;

		emitterParams.particleRenderer = new ParticleRenderer();
		this.particleMaterial = emitterParams.particleRenderer.initialize( this.uniformTypes[ this.currentUniformType ], {
			scene: this.Scene,
			maxDisplayParticles: maxDisplayParticles,
			group: new THREE.Group(),
		} );

		// NOTE: Velocity animation and color animation are not on the same lifecycle
		const emitter = new Emitter( emitterParams );
		this.particleSystem.addEmitter( emitter );

	}

	onStep( dt, totalTimeElapsed ) {

		if ( ! this.particleMaterial ) {

			return;

		}

		this.particleSystem.step( dt, totalTimeElapsed );

		if ( ! this.particleSystem.StillActive ) {

			this.particleSystem.dispose();
			this.particleSystem = null;
			this.createPointsParticleSystem( this.currentUniformType );

		}

	}

	async onSetupProject() {

		this.loadRGBE( './resources/moonless_golf_2k.hdr' );

		this.createPointsParticleSystem();

		// Currently it seems like the particles can only be reset when they are still active
		// Even if the dispose method is commented out
		this.DebugGui.add( { 'Reset Current Sim': () => this.particleSystem.killAllEmitters() }, 'Reset Current Sim' ).name( 'Reset Current Sim' );

		const simOptions = Object.keys( this.uniformTypes );
		const params = { selectedSim: this.currentUniformType };

		this.DebugGui.add( params, 'selectedSim', simOptions )
			.name( 'Simulation Type' )
			.onChange( ( value ) => {

				this.currentUniformType = value;
				this.particleSystem.killAllEmitters();

			} );

	}

}

const APP_ = new ParticleProject();

window.addEventListener( 'DOMContentLoaded', async () => {

	await APP_.initialize( {
		debug: true,
		projectName: 'Explosion Particles',
		webGL: true,
	} );

} );
