<html lang="en">
	<head>
		<title>three.js webgpu - Bit counting shader validation</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
		}

		#demo {
			display: flex;
			flex-direction: row;
			align-items: center;
		}

		.renderer-wrapper {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		#antialiasing-disabled {
			border-right: 1px solid black;
		}

		canvas {
			width: 100%;
			height: 100%;
		}
	</style>
	<body>
		<div id="demo">
			<div id="bitCountGPU" class="renderer-wrapper">
				<div>bitCountGPU</div>
			</div>
			<div id="bitCountGL" class="renderer-wrapper">
				<div>bitCountGL</div>
			</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, instancedArray, countOneBits, instanceIndex, If, vec3 } from 'three/tsl';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			const gui = new GUI();

			const webGLBaseArray = [];
			const webGPUBaseArray = [];

			for ( let i = 0; i < 2000; i ++ ) {

				webGLBaseArray.push( i + 1 );
				webGPUBaseArray.push( i + 1 );

			}

			const webGLTestArray = new Uint32Array( webGLBaseArray );
			const webGPUTestArray = new Uint32Array( webGPUBaseArray );

			const testBufferWebGL = instancedArray( webGLTestArray, 'uint' );
			const testBufferWebGPU = instancedArray( webGPUTestArray, 'uint' );

			const webGLArrayContainer = null;
			let arary2Container = null;

			const functionObj = {};

			function windowResizeCallback( renderer, camera ) {

				const halfWidth = window.innerWidth / 2;
				renderer.setSize( halfWidth, window.innerHeight );
				const aspect = ( halfWidth ) / window.innerHeight;

				camera.aspect = aspect;
				camera.updateProjectionMatrix();

			}
			
			async function init( forceWebGL = false ) {

				const camera = new THREE.PerspectiveCamera();
				camera.fov = 60;
				camera.near = 1;
				camera.far = 2100;
				camera.position.z = 3;

				const scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x313131 );
			
				const storageBuffer = forceWebGL ? testBufferWebGL : testBufferWebGPU;
				const computeBuffer = Fn( () => {
			
					storageBuffer.element( instanceIndex ).assign( countOneBits( storageBuffer.element( instanceIndex ) ) );

				} )().compute( 32 );

				// Create computeInit function

				const material = new THREE.MeshBasicNodeMaterial( { color: 0x00ff00 } );
				material.colorNode = vec3( 0.0, 1.0, 0.0 );

				const geometry = new THREE.PlaneGeometry();
				const mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				// Create Standard Renderer
				const renderer = new THREE.WebGPURenderer( { antialias: false, forceWebGL: forceWebGL } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth / 3, window.innerHeight );

				const actionName = `logBuffer${forceWebGL ? 'GL' : 'GPU'}`;
			
				functionObj[ actionName ] = async () => {

					if ( forceWebGL ) {

						array1Container = new Uint32Array( await renderer.getArrayBufferAsync( storageBuffer.value ) );
						console.log( array1Container );

					} else {

						arary2Container = new Uint32Array( await renderer.getArrayBufferAsync( storageBuffer.value ) );
						console.log( arary2Container );
			
					}

			
				};

				gui.add( functionObj, actionName );

				const animate = () => {

					renderer.render( scene, camera );

				};

				renderer.setAnimationLoop( animate );

				renderer.computeAsync( computeBuffer );

				document.body.querySelector( `#bitCount${forceWebGL ? 'GL' : 'GPU'}` ).appendChild( renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

				function onWindowResize() {

					windowResizeCallback( renderer, camera );

				}

			}

			init( );
			init( true );


			functionObj.compareBuffers = () => {

				for ( let i = 0; i < array1Container.length; i ++ ) {

					if ( array1Container[ i ] !== arary2Container[ i ] ) {

						console.log( `Index ${i} is incorrect` );
						console.log( `WebGL value for ${i + 1} is ${array1Container[ i ]}` );
						console.log( `WebGPU value for ${i + 1} is ${arary2Container[ i ]}` );

					}
			
				}

			};

			gui.add( functionObj, 'compareBuffers' );

		</script>
	</body>
</html>
