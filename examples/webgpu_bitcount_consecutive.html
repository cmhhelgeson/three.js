<html lang="en">
	<head>
		<title>three.js webgpu - Bit counting shader validation</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
		}

		#demo {
			display: flex;
			flex-direction: row;
			align-items: center;
		}

		.renderer-wrapper {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		#antialiasing-disabled {
			border-right: 1px solid black;
		}

		canvas {
			width: 100%;
			height: 100%;
		}
	</style>
	<body>
		<div id="demo">
			<div id="bitCountGL" class="renderer-wrapper">
				<div>bitCountGL</div>
			</div>
			<div id="bitCountGPU" class="renderer-wrapper">
				<div>bitCountGPU</div>
			</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, instancedArray, countTrailingZeros, countLeadingZeros, countOneBits, instanceIndex, uint, uv, uvec2, vec2, floor, float, If, vec3 } from 'three/tsl';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			function windowResizeCallback( renderer, camera ) {

				const halfWidth = window.innerWidth / 2;
				renderer.setSize( halfWidth, window.innerHeight );
				const aspect = ( halfWidth ) / window.innerHeight;

				camera.aspect = aspect;
				camera.updateProjectionMatrix();

			}

			const webGLTestArray = [];
			const webGPUTestArray = [];

			const size = 2000;

			for ( let i = 0; i < size; i ++ ) {

				webGLTestArray.push( i + 1 );
				webGPUTestArray.push( i + 1 );

			}

			const webGLBuffer = new Uint32Array( webGLTestArray );
			const webGPUBuffer = new Uint32Array( webGPUTestArray );
			const gui = new GUI();
			
			async function init( forceWebGL = false ) {

				const camera = new THREE.PerspectiveCamera();
				camera.fov = 60;
				camera.near = 1;
				camera.far = 2100;
				camera.position.z = 3;

				const scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x313131 );

				const storageBuffer = instancedArray( size, 'uint' ).setPBO( true );
				const computeBuffer = Fn( () => {
			
					storageBuffer.element( instanceIndex ).assign( countOneBits( storageBuffer.element( instanceIndex ) ) );

				} )().compute( size );

				// Create computeInit functio

				const testStorage = instancedArray( forceWebGL ? webGLBuffer : webGPUBuffer, 'uint' ).setPBO( true );

				const computeInit = Fn( () => {

					storageBuffer.element( instanceIndex ).assign( testStorage.element( instanceIndex ) );

				} )().compute( size );

				const material = new THREE.MeshBasicNodeMaterial( { color: 0x00ff00 } );
				material.colorNode = vec3( 0.0, 1.0, 0.0 );

				const geometry = new THREE.PlaneGeometry();
				const mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				// Create Standard Renderer
				const renderer = new THREE.WebGPURenderer( { antialias: false, forceWebGL: forceWebGL } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth / 2, window.innerHeight );

				const functionObj = {};

				functionObj.logBuffer = async () => {

					console.log( JSON.stringify( new Uint32Array( await renderer.getArrayBufferAsync( storageBuffer.value ) ) ) );
			
				};

				gui.add( functionObj, 'logBuffer' ).name( `Log ${forceWebGL ? 'WebGL' : 'WebGPU'}` );
			


				const animate = () => {

					renderer.render( scene, camera );

				};

				renderer.setAnimationLoop( animate );

				let computeStep = true;

				await renderer.computeAsync( computeInit );

				 const stepAnimation = async function () {

					if ( computeStep ) {

						await renderer.computeAsync( computeBuffer );

					} else {

						renderer.computeAsync( computeInit );
			
					}

					computeStep = ! computeStep;

					setTimeout( stepAnimation, 1000 );

				};

				stepAnimation();

				const idTest = forceWebGL ? 'GL' : 'GPU';

				const idSelector = 'bitCount';

				document.body.querySelector( `#bitCount${idTest}` ).appendChild( renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

				function onWindowResize() {

					windowResizeCallback( renderer, camera );

				}

			}

			init();
			init( true );

		</script>
	</body>
</html>
