<html lang="en">
	<head>
		<title>three.js webgpu - storage pbo external element</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
			<br /> This example demonstrates the performance of various parallel reduction kenrels in comparison with a serial execution.
			<br /> Reference implementations are translated from the CUDA code present in the following books/repos:
			<br /> <a href="https://www.cambridge.org/core/books/programming-in-parallel-with-cuda/C43652A69033C25AD6933368CDBE084C"><i>Programming in Parallel with CUDA</i></a> by <a href="https://people.bss.phy.cam.ac.uk/~rea1/">Richard Ansorge</a>
			<br />
			<div id="left_side_display" style="
				position: absolute;
				top: 150px;
				left: 0;
				padding: 10px;
				background: rgba( 0, 0, 0, 0.5 );
				color: #fff;
				font-family: monospace;
				font-size: 12px;
				line-height: 1.5;
				pointer-events: none;
				text-align: left;
			"></div>
			<div id="right_side_display" style="
			position: absolute;
			top: 150px;
			right: 0;
			padding: 10px;
			background: rgba( 0, 0, 0, 0.5 );
			color: #fff;
			font-family: monospace;
			font-size: 12px;
			line-height: 1.5;
			pointer-events: none;
			text-align: left;
		"></div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { storage, Loop, If, vec3, uniform, uv, uint, float, Fn, vec2, invocationLocalIndex, uvec2, floor, instanceIndex, workgroupId } from 'three/tsl';

			import WebGPU from 'three/addons/capabilities/WebGPU.js';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			const timestamps = {
				left_side_display: document.getElementById( 'left_side_display' ),
				right_side_display: document.getElementById( 'right_side_display' )
			};

			// Total number of elements and the dimensions of the display grid.
			const size = 65536;
			const gridDim = Math.sqrt( size );

			// Algorithm speed increase as you iterate through algorithms array
			const algorithms = [ 'CPU (Serial)', 'CPU (Reduce)', 'Reduce 0', 'Reduce 1', 'Reduce 2' ];

			const leftEffectController = {
				algo: 'Reduce 0',
				gridWidth: uniform( gridDim ),
				gridHeight: uniform( gridDim ),
				highlight: uniform( 0 ),
				validate: uniform( 0 ),
				state: 'Run Algo',
				numThreadsDispatched: uniform( size / 2 ),
			};

			const rightEffectController = {
				algo: 'CPU (Serial)',
				gridWidth: uniform( gridDim ),
				gridHeight: uniform( gridDim ),
				highlight: uniform( 0 ),
				validate: uniform( 0 ),
				state: 'Run Algo',
				numThreadsDispatched: uniform( size / 2 )
			};

			const gui = new GUI();

			let lastValidLeftValue = 'CPU (Serial)';
			let lastValidRightValue = 'Reduce 0';
			let isSyncingAlgos = false;

			const leftSideAlgoController = gui.add( leftEffectController, 'algo', algorithms ).onChange( () => {

				if ( isSyncingAlgos ) return;

				if ( leftEffectController.algo === rightEffectController.algo ) {

					isSyncingAlgos = true;
					leftSideAlgoController.setValue( lastValidLeftValue );
					isSyncingAlgos = false;

				} else {

					lastValidLeftValue = leftEffectController.algo;

				}

			} );

			const rightSideAlgoController = gui.add( rightEffectController, 'algo', algorithms ).onChange( () => {

				if ( isSyncingAlgos ) return;

				if ( rightEffectController.algo === leftEffectController.algo ) {

					isSyncingAlgos = true;
					rightSideAlgoController.setValue( lastValidRightValue );

				} else {

					lastValidRightValue = rightEffectController.algo;

				}
			
			} );

			const stateLeftController = gui.add( leftEffectController, 'state' ).name( 'Left Display State' );
			stateLeftController.domElement.style.pointerEvents = 'none';
			const stateRightController = gui.add( rightEffectController, 'state' ).name( 'Right Display State' );
			stateRightController.domElement.style.pointerEvents = 'none';

			if ( WebGPU.isAvailable() === false ) {

				document.body.appendChild( WebGPU.getErrorMessage() );

				throw new Error( 'No WebGPU support' );

			}

			// Pros: absurdly simple
			// Cons: Unperformant, especially at higher element counts
			const serialAlgorithm = ( arr ) => {

				const t0 = performance.now();
			
				for ( let i = 0; i < size - 1; i ++ ) {

					arr[ i + 1 ] += i;

				}

				const t1 = performance.now();

				return ( t1 - t0 ).toFixed( 2 );

			};

			const serialAlgorithmNativeReduce = ( arr ) => {

				const t0 = performance.now();
			
				const sum = arr.reduce( ( acc, val ) => acc + val, 0 );

				const t1 = performance.now();

				return ( t1 - t0 ).toFixed( 2 );

			
			};

			// Pros: Faster than CPU
			// Cons:
			//	- Only works with valus that are powers of n
			// 	- Kernel must be executed in a loop, meaning each
			//	- loop with repeat requests to storage memory
			//	- that can induces stalls, especially as thread count
			//	- decrease per each execution

			// Allow Workgroup Array Swaps
			init();

			init( false );

			// When forceGlobalSwap is true, force all valid local swaps to be global swaps.
			async function init( leftSideDisplay = true ) {

				const effectController = leftSideDisplay ? leftEffectController : rightEffectController;

				const aspect = ( window.innerWidth / 2 ) / window.innerHeight;
				const camera = new THREE.OrthographicCamera( - aspect, aspect, 1, - 1, 0, 2 );
				camera.position.z = 1;

				const scene = new THREE.Scene();

				const array = new Uint32Array( Array.from( { length: size }, ( _, i ) => {

					return i + 1;

				} ) );

				//const infoArray = new Uint32Array( [ size / 2 ] );

				const currentElementsBuffer = new THREE.StorageInstancedBufferAttribute( array, 1 );
				const currentElementsStorage = storage( currentElementsBuffer, 'uint', size ).setPBO( true ).label( 'Elements' );

				// Buffer to hold info on number of threads dispatched, size of dispatch, etc
				//const infoBuffer = new THREE.StorageInstancedBufferAttribute( infoArray, 1 );
				//const infoStorage = storage( infoBuffer, 'uint', 1 ).setPBO( true ).label( 'Info' );

				const computeResetBufferFn = Fn( () => {

					currentElementsStorage.element( instanceIndex ).assign( 1 );
			
				} );

				// Re-initialize compute buffer
				const computeResetBuffer = computeResetBufferFn().compute( size );

				const renderer = new THREE.WebGPURenderer( { antialias: false, trackTimestamp: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth / 2, window.innerHeight );

				await renderer.computeAsync( computeResetBuffer );

				let maxWorkgroupSize = 64;

				if ( renderer.backend.device !== null ) {

					maxWorkgroupSize = renderer.backend.device.limits.maxComputeWorkgroupSizeX;

				}

				const computeReduce0Fn = Fn( () => {

					const { numThreadsDispatched } = effectController;

					const tid = uint( maxWorkgroupSize ).mul( workgroupId.x ).add( invocationLocalIndex );

					currentElementsStorage.element( tid ).addAssign( currentElementsStorage.element( tid.add( numThreadsDispatched ) ) );

				} )();

				// Cache reduce0 calls

				const reduce0Calls = [];

				for ( let i = size / 2; i >= 1; i /= 2 ) {

					const reduce0 = computeReduce0Fn.compute( i, [ maxWorkgroupSize ] );
					reduce0Calls.push( reduce0 );

				}

				const computeReduce1Fn = Fn( () => {

					const tid = uint( maxWorkgroupSize ).mul( workgroupId.x ).mul( invocationLocalIndex );
					const tSum = float( 0.0 ).toVar();

					Loop( { start: tid, end: uint( size ), type: 'int', condition: '<', update: `+= numWorkgroups * ${maxWorkgroupSize}u` }, ( { k } ) => {

						tSum.addAssign( currentElementsStorage.element( k ) );

					} );

					currentElementsStorage.element( tid ).assing( tSum );

				} )();

				const reduce1Calls = [

					computeReduce1Fn.compute( size, [ maxWorkgroupSize ] ),
					computeReduce1Fn.compute( maxWorkgroupSize, [ maxWorkgroupSize ] ),
					computeReduce1Fn.compute( 1, [ 1 ] ),
			
				];

				/* const computeReduce2 = Fn( () => {

					const tid = workgroupSize.mul( workgroupId.x ).mul( invocationLocalIndex );

					const stride = numWorkgroups.mul( workgroupId.x );

					const localStorage = workgroupArray( 'uint', 256 );


			
					Loop( { start: tid, end: m, type: 'int', condition: '<', update: stride }, ( { k } ) => {

						localStorage.element( invocationLocalIndex ).addAssign( currentElementsStorage.element( k ) );

						workgroupBarrier();

					} );

					Loop( { start: workgroupSize.div( 2 ), end: uint( 0 ), condition: '>', update: ' /= 2u' }, ( { k } ) => {

						If( invocationLocalIndex.lessThan( k ), () => {

							localStorage.element( invocationLocalIndex ).addAssign( localStorage.element( invocationLocalIndex.add( k ) ) );
							workgroupBarrier();

						} );

					} );

					If( invocationLocalIndex.equal( 0 ), () => {
			
						currentElementsStorage.element( workgroupId.x ).assign( localStorage.element( 0 ) );
			
					} );

				} );

				const reduce3 = Fn( () => {

			

			
				} ); */


				const material = new THREE.MeshBasicNodeMaterial( { color: 0x00ff00 } );

				const display = Fn( () => {

					const { gridWidth, gridHeight, highlight } = effectController;

					const newUV = uv().mul( vec2( gridWidth, gridHeight ) );

					const pixel = uvec2( uint( floor( newUV.x ) ), uint( floor( newUV.y ) ) );

					const elementIndex = uint( gridWidth ).mul( pixel.y ).add( pixel.x );

					const colorChanger = currentElementsStorage.element( elementIndex );

					const subtracter = float( colorChanger ).div( gridWidth.mul( gridHeight ) );

					const color = vec3( subtracter.oneMinus() ).toVar();

					If( highlight.equal( 1 ), () => {

						color.assign( vec3( 0.0, subtracter.oneMinus(), 0.0 ) );

					} );

					return color;

				} );

				material.colorNode = display();
				material.needsUpdate = true;

				const plane = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), material );
				scene.add( plane );

				const animate = () => {

					renderer.render( scene, camera );

				};

				renderer.setAnimationLoop( animate );

				document.body.appendChild( renderer.domElement );
				renderer.domElement.style.position = 'absolute';
				renderer.domElement.style.top = '0';
				renderer.domElement.style.left = '0';
				renderer.domElement.style.width = '50%';
				renderer.domElement.style.height = '100%';

				if ( ! leftSideDisplay ) {

					renderer.domElement.style.left = '50%';

					scene.background = new THREE.Color( 0x212121 );

				} else {

					scene.background = new THREE.Color( 0x313131 );

				}

				renderer.info.autoReset = false;

				const stepAnimation = async function () {

					const currentAlgorithm = effectController.algo;
					const state = effectController.state;
					const stateController = leftSideDisplay ? stateLeftController : stateRightController;

					if ( state === 'Reset' ) {

						if ( currentAlgorithm.substring( 0, 3 ) === 'CPU' ) {

							array.fill( 1 );
			
						} else {

							renderer.compute( computeResetBuffer );

						}

						//renderer.compute( computeResetBuffer );
						renderer.render( scene, camera );

					} else if ( state === 'Run Algo' ) {

						renderer.info.reset();

						let cpuTime = 0;

						switch ( currentAlgorithm ) {

							case 'CPU (Serial)': {

								cpuTime = serialAlgorithm( array );

								break;

							}

							case 'CPU (Reduce)': {

								cpuTime = serialAlgorithmNativeReduce( array );
								console.log( cpuTime );

								break;

							}
			
							case 'Reduce 0': {

								let m = size / 2;

								for ( let i = 0; i < reduce0Calls.length; i ++ ) {

									effectController.numThreadsDispatched.value = m;

									const reduce0 = reduce0Calls[ i ];
									// Do a reduction step
									renderer.compute( reduce0 );
									renderer.resolveTimestampsAsync( THREE.TimestampQuery.COMPUTE );

									m /= 2;

								}


								break;

							}

							case 'Reduce 1': {

								for ( let i = 0; i < reduce1Calls.length; i ++ ) {

									renderer.compute( reduce1Calls[ i ] );

								}
			
							}

								break;

						}

						const reduceArray = new Uint32Array( await renderer.getArrayBufferAsync( currentElementsBuffer ) );

						if ( reduceArray[ 0 ] === size ) {

							effectController.validate.value = 1;

						} else {

							effectController.validate.value = 0;

						}

						let passInfoString = '';

						if ( effectController.algo.substring( 0, 3 ) === 'CPU' ) {

							passInfoString = `Ran in ${cpuTime}ms<br>`;

						} else {

							passInfoString = `${renderer.info.compute.frameCalls} pass in ${renderer.info.compute.timestamp.toFixed( 6 )}ms<br>`;

						}


						timestamps[ leftSideDisplay ? 'left_side_display' : 'right_side_display' ].innerHTML = `

							Compute ${effectController.algo}: ${passInfoString}`;

					}

					renderer.render( scene, camera );
					renderer.resolveTimestampsAsync( THREE.TimestampQuery.RENDER );

					// Validate next state

					if ( state === 'Run Algo' ) {

						stateController.setValue( 'Validate' );

						effectController.highlight.value = 1;

					} else if ( state === 'Validate' ) {

						stateController.setValue( 'Reset' );

						effectController.highlight.value = 0;

					} else if ( state === 'Reset' ) {

						stateController.setValue( 'Run Algo' );

					}

					setTimeout( stepAnimation, 500 );

				};

			
				stepAnimation();

				window.addEventListener( 'resize', onWindowResize );

				function onWindowResize() {

					renderer.setSize( window.innerWidth / 2, window.innerHeight );

					const aspect = ( window.innerWidth / 2 ) / window.innerHeight;

					const frustumHeight = camera.top - camera.bottom;

					camera.left = - frustumHeight * aspect / 2;
					camera.right = frustumHeight * aspect / 2;

					camera.updateProjectionMatrix();

					renderer.render( scene, camera );

				}

			}

		</script>
	</body>
</html>
