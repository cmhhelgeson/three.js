<html lang="en">
	<head>
		<title>three.js webgpu - Bit counting shader validation</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
		}

		#demo {
			display: flex;
			flex-direction: row;
			align-items: center;
		}

		.renderer-wrapper {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		#antialiasing-disabled {
			border-right: 1px solid black;
		}

		canvas {
			width: 100%;
			height: 100%;
		}
	</style>
	<body>
		<div id="demo">
			<div id="bitCount" class="renderer-wrapper">
				<div>bitCount</div>
			</div>
			<div id="countTrailingZeros" class="renderer-wrapper">
				<div>countTrailingZeros</div>
			</div>
			<div id="countLeadingZeros" class="renderer-wrapper">
				<div>countLeadingZeros</div>
			</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, instancedArray, countTrailingZeros, countLeadingZeros, bitCount, instanceIndex, uint, uv, uvec2, vec2, floor, float, If, vec3 } from 'three/tsl';

			const COUNT_TRAILING_ZEROS = 'countTrailingZeros';
			const COUNT_LEADING_ZEROS = 'countLeadingZeros';
			const BIT_COUNT = 'bitCount';

			function windowResizeCallback( renderer, camera ) {

				const thirdWidth = window.innerWidth / 3;
				renderer.setSize( thirdWidth, window.innerHeight );
				const aspect = ( thirdWidth ) / window.innerHeight;

				camera.aspect = aspect;
				camera.updateProjectionMatrix();

			}

			const zerosTestArray = new Uint32Array( [
				1, 2, 4, 8, 16, 32, 64, 128, 256, 512,
				1024, 2048, 4096, 8192, 16384, 32768,
				65536, 131072, 262144, 524288, 1048576, 2097152,
				4194304, 8388608, 16777216, 33554432, 67108864,
				134217728, 268435456, 536870912, 1073741824, 2147483648
			] );

			const bitCountTestArray = new Uint32Array( [
				1, 3, 7, 15, 31, 63, 127,
				255, 511, 1023, 2047, 4095, 8191,
				16383, 32767, 65535, 131071, 262143,
				524287, 1048575, 2097151, 4194303, 8388607,
				16777215, 33554431, 67108863, 134217727, 268435455,
				536870911, 1073741823, 2147483647, 0
			] );
			
			async function init( algoType ) {

				const camera = new THREE.PerspectiveCamera();
				camera.fov = 60;
				camera.near = 1;
				camera.far = 2100;
				camera.position.z = 3;

				const scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x313131 );
			
				let testBuffer;
			
				let validationMethod = ( value, index, color ) => {
			
					return vec3( 0, 0, 0 );

				};

				let usedTSL;

				if ( algoType === COUNT_TRAILING_ZEROS ) {

					usedTSL = countTrailingZeros;
					validationMethod = ( value, index, baseColor ) => {

						const color = vec3( 0.0, 0.0, 0.0 );

						If( value.equal( index ), () => {

							color.assign( vec3( 0, baseColor, 0 ) );

						} ).Else( () => {

							color.assign( vec3( baseColor, 0, 0 ) );

						} );

						return color;

					};

				} else if ( algoType === COUNT_LEADING_ZEROS ) {

					usedTSL = countLeadingZeros;

					validationMethod = ( value, index, baseColor ) => {

						const color = vec3( 0.0, 0.0, 0.0 );

						If( value.equal( uint( 32 ).sub( 1 ).sub( index ) ), () => {

							color.assign( vec3( 0, baseColor, 0 ) );

						} ).Else( () => {

							color.assign( vec3( baseColor, 0, 0 ) );

						} );

						return color;

					};
			

				} else {

					validationMethod = ( value, index, baseColor ) => {

						const color = vec3( 0.0, 0.0, 0.0 );

						If( value.equal( index.add( 1 ) ), () => {

							color.assign( vec3( 0, baseColor, 0 ) );

						} ).Else( () => {

							color.assign( vec3( baseColor, 0, 0 ) );

						} );

						return color;

					};

					usedTSL = bitCount;

				}

				const storageBuffer = instancedArray( 32, 'uint' ).setPBO( true );
				const computeBuffer = Fn( () => {
			
					storageBuffer.element( instanceIndex ).assign( usedTSL( storageBuffer.element( instanceIndex ) ) );

				} )().compute( 32 );

				// Create computeInit function

				if ( algoType !== BIT_COUNT ) {

					testBuffer = instancedArray( zerosTestArray, 'uint' ).setPBO( true );

				} else {

					testBuffer = instancedArray( bitCountTestArray, 'uint' ).setPBO( true );

				}

				const computeInit = Fn( () => {

					storageBuffer.element( instanceIndex ).assign( testBuffer.element( instanceIndex ) );

				} )().compute( 32 );

				const material = new THREE.MeshBasicNodeMaterial( { color: 0x00ff00 } );
				material.colorNode = Fn( () => {

					const newUV = uv().mul( vec2( 32.0, 1.0 ) );

					const pixel = uvec2( uint( floor( newUV.x ) ), uint( floor( newUV.y ) ) );

					const value = float( storageBuffer.element( pixel.x ) );

					const color = value.div( 32 );

					return validationMethod( value, pixel.x, color );

				} )();

				const geometry = new THREE.PlaneGeometry();
				const mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				// Create Standard Renderer
				const renderer = new THREE.WebGPURenderer( { antialias: false, forceWebGL: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth / 3, window.innerHeight );

				const animate = () => {

					renderer.render( scene, camera );

				};

				renderer.setAnimationLoop( animate );

				let computeStep = true;

				await renderer.computeAsync( computeInit );

				 const stepAnimation = async function () {

					if ( computeStep ) {

						await renderer.computeAsync( computeBuffer );

					} else {

						renderer.computeAsync( computeInit );
			
					}

					computeStep = ! computeStep;

					setTimeout( stepAnimation, 1000 );

				};

				stepAnimation();

				document.body.querySelector( `#${algoType}` ).appendChild( renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

				function onWindowResize() {

					windowResizeCallback( renderer, camera );

				}

			}

			init( COUNT_TRAILING_ZEROS );
			init( COUNT_LEADING_ZEROS );
			init( BIT_COUNT );

		</script>
	</body>
</html>
