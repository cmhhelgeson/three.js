<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

<body>
	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgpu - postprocessing - screen space reflections<br />
		<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by 
		<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.<br />
	</div>
	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';
		import { pass, mrt, uniform, output, transformedNormalView, metalness } from 'three/tsl';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { chromaticAberration } from 'three/addons/tsl/display/ChromaticAberration.js';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
		import Stats from 'three/addons/libs/stats.module.js';

		const effectController = {
			amount: uniform( 30.0 ),
			radialIntensity: uniform( 0.0 ),
			directionX: uniform( 0.707 ),
			directionY: uniform( 0.707 ),
			enabled: true
		};

		let camera, scene, renderer, postProcessing, ssrPass;
		let gui, stats, controls;

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();

			const dracoLoader = new DRACOLoader();
			dracoLoader.setDecoderPath( 'jsm/libs/draco/' );
			dracoLoader.setDecoderConfig( { type: 'js' } );
		
			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				gltf.scene.traverse( function ( object ) {

					if ( object.material ) {

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;
		
					}
		
				} );
		
				gltf.scene.position.y = 0.1;
				scene.add( gltf.scene );

			} );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			//

			postProcessing = new THREE.PostProcessing( renderer );

			const scenePass = pass( scene, camera, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter } );
			scenePass.setMRT( mrt( {
				output: output,
				normal: transformedNormalView,
				metalness: metalness
			} ) );

			const scenePassColor = scenePass.getTextureNode( 'output' );
			const scenePassNormal = scenePass.getTextureNode( 'normal' );
			const scenePassDepth = scenePass.getTextureNode( 'depth' );
			const scenePassMetalness = scenePass.getTextureNode( 'metalness' );

			const objectMask = scenePass.a;

			const colorTest = objectMask.mix( scenePass, scenePass );
		
			const chromaticAberrationPass = chromaticAberration(
				scenePassColor,
				effectController.amount,
				effectController.radialIntensity,
				effectController.directionX,
				effectController.directionY
			);
			postProcessing.outputNode = chromaticAberrationPass;

			//

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			// stats

			stats = new Stats();
			document.body.appendChild( stats.dom );

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			gui = new GUI();
			gui.add( effectController.amount, 'value', 0.0, 100.0, 1.0 ).name( 'amount' );
			gui.add( effectController.radialIntensity, 'value', 0.0, 5.0 ).name( 'radialIntensity' );
			gui.add( effectController.directionX, 'value', 0.0, 1.0 ).name( 'directionX' );
			//gui.add( effectController.directionY, 'value', 0.0, 1.0 ).name( 'directionY' );
			gui.add( effectController, 'enabled' ).onChange( () => {

				if ( effectController.enabled === true ) {

					postProcessing.outputNode = chromaticAberrationPass;

				} else {

					postProcessing.outputNode = scenePass;

				}

				postProcessing.needsUpdate = true;

			} );
		
		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			stats.begin();

			controls.update();

			postProcessing.render();

			stats.end();

		}

	</script>
</body>

</html>
